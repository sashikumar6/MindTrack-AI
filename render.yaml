databases:
  - name: mindtrack-ai-db
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: web
    name: mindtrack-ai
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_FINETUNED_MODEL
        sync: false
      - key: STT_PROVIDER
        value: openai
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-4o-mini-transcribe
      - key: TTS_PROVIDER
        value: openai
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_VOICE
        value: marin
      - key: ENABLE_JOB_TRACKER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mindtrack-ai-db
          property: connectionString
      - key: DEMO_MAX_POSTS_PER_HOUR
        value: "60"
      - key: DEMO_MAX_POSTS_PER_HOUR_PER_USER
        value: "120"
      # --- Auth (see DEPLOYMENT.md for the Google Cloud Console walkthrough) ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: OAUTH_REDIRECT_URL
        value: https://mindtrack-ai.onrender.com/auth/callback
      - key: FRONTEND_URL
        value: https://mindtrack-ai.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://mindtrack-ai.onrender.com
      - key: SESSION_HTTPS_ONLY
        value: "true"
