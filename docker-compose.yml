services:
  postgres:
    image: postgres:16-alpine
    container_name: mindtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindtrack
      POSTGRES_PASSWORD: mindtrack
      POSTGRES_DB: mindtrack
    ports:
      - "5455:5432"
    volumes:
      - mindtrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindtrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mindtrack-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://mindtrack:mindtrack@postgres:5432/mindtrack
      TZ: America/Los_Angeles
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:20-alpine
    container_name: mindtrack-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  mindtrack-postgres-data:
