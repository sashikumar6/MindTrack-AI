# Free plan: no payment method required. Tradeoffs vs. starter:
#   - Web service sleeps after 15 min idle (~30-60s cold start on next hit).
#     No longer a problem for the scheduler specifically, since
#     ENABLE_JOB_TRACKER is off below -- there's no daily job that needs the
#     process alive at a fixed hour.
#   - The free Postgres database expires 30 days after creation (14-day
#     grace period after that) and is then deleted. Fine for a demo link;
#     upgrade the database plan before ~day 30 if this needs to persist.
databases:
  - name: mindtrack-ai-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: mindtrack-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_FINETUNED_MODEL
        sync: false
      - key: STT_PROVIDER
        value: openai
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-4o-mini-transcribe
      - key: TTS_PROVIDER
        value: openai
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_VOICE
        value: marin
      - key: ENABLE_JOB_TRACKER
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: mindtrack-ai-db
          property: connectionString
      - key: DEMO_MAX_POSTS_PER_HOUR
        value: "60"
      - key: DEMO_MAX_POSTS_PER_HOUR_PER_USER
        value: "120"
      # --- Auth (see DEPLOYMENT.md for the Google Cloud Console walkthrough) ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: OAUTH_REDIRECT_URL
        value: https://mindtrack-ai.onrender.com/auth/callback
      - key: FRONTEND_URL
        value: https://mindtrack-ai.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://mindtrack-ai.onrender.com
      - key: SESSION_HTTPS_ONLY
        value: "true"
