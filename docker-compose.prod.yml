services:
  postgres:
    image: postgres:16-alpine
    container_name: mindtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindtrack
      POSTGRES_PASSWORD: mindtrack
      POSTGRES_DB: mindtrack
    volumes:
      - mindtrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindtrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindtrack-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mindtrack:mindtrack@postgres:5432/mindtrack
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: mindtrack-caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  mindtrack-postgres-data:
  caddy-data:
  caddy-config:
